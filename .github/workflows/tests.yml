name: Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
      UV_MANAGED_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - name: Install pinned Python
        run: uv python install
      - name: Install locked core, GUI and test environment
        run: uv sync --locked --extra gui --extra test
      - name: Record the environment
        run: |
          uv --version
          uv run --no-sync python --version
          uv pip freeze
      - run: uv run --no-sync python -B -m pytest tests -q -ra --durations=10 -p no:cacheprovider
