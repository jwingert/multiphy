[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiphy"
dynamic = ["version"]
description = "Cross-day single-unit matching and curation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
gui = ["PySide6"]
# The wheel-content test builds offline without build isolation.
test = ["pytest", "pip", "setuptools>=77", "wheel"]

[project.scripts]
multiphy = "multiphy.launch.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "multiphy.__version__"}

[tool.setuptools.packages.find]
include = ["multiphy*"]

[tool.setuptools.package-data]
multiphy = ["*.md", "docs/*.md"]
"multiphy.viewer" = ["fonts/*.ttf", "fonts/*.txt"]
"multiphy.viewer.logo" = ["*.svg"]
